services:
  leadradar:
    build:
      context: .
      dockerfile: Dockerfile
    image: leadradar:latest
    container_name: leadradar_app
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    volumes:
      # Persistencia de datos del CRM, historial de contactados y sesión de WhatsApp
      - ./server/data:/app/server/data
    # 2GB de memoria compartida para evitar crashes de Chromium en Puppeteer
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
